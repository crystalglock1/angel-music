<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="Angel — музыка, плейлисты и любимые треки">
  <title>Angel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080b16;--panel:#111626;--panel2:#171c2d;--line:rgba(170,177,226,.15);--muted:#9da5bd;--text:#f7f7fc;--blue:#73cfff;--purple:#7564ff;--pink:#ff8ca8;--shadow:0 18px 60px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(ellipse at 67% -8%,rgba(67,75,173,.24),transparent 38%),radial-gradient(ellipse at 0% 85%,rgba(37,53,117,.18),transparent 35%),#080b16;padding:calc(env(safe-area-inset-top) + 22px) 0 calc(112px + env(safe-area-inset-bottom));}
    button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.app{width:min(100%,900px);margin:0 auto;padding:0 22px}.topbar{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 24px}.brand{font-size:clamp(34px,8vw,48px);font-weight:650;letter-spacing:-1.8px;margin:0}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:#ffffff08;font-size:25px;display:none}.search-wrap{height:60px;border:1px solid var(--line);border-radius:23px;background:rgba(35,39,57,.72);display:flex;align-items:center;padding:0 18px;gap:14px;box-shadow:inset 0 1px 0 #ffffff08}.search-wrap svg{width:25px;flex:none;color:#aab2cc}.search-wrap input{border:0;outline:0;background:transparent;color:white;width:100%;font-size:17px;min-width:0}.search-wrap input::placeholder{color:#a5abc0}.home-cards{display:grid;gap:22px;margin-top:34px}.feature{position:relative;overflow:hidden;min-height:285px;border:1px solid var(--line);border-radius:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;background:#171c30;isolation:isolate;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}.feature:active{transform:scale(.99)}.feature:before,.feature:after{content:"";position:absolute;z-index:-1;pointer-events:none}.feature:before{width:120%;height:70%;left:-10%;top:10%;border-radius:50%;filter:blur(32px);opacity:.85;transform:rotate(-13deg)}.feature.playlists{background:radial-gradient(ellipse at 72% 15%,#1a3c8a 0,transparent 43%),linear-gradient(145deg,#111a35,#171a35 55%,#10182d)}.feature.playlists:before{background:linear-gradient(125deg,transparent 18%,#4c69ff 40%,#9d63ff 56%,transparent 78%);opacity:.55}.feature.fav{background:radial-gradient(ellipse at 73% 35%,#9d424c 0,transparent 43%),linear-gradient(145deg,#211927,#241a2a 60%,#341d2b)}.feature.fav:before{background:linear-gradient(110deg,transparent 25%,#f15b89 49%,#ff9a82 70%,transparent 86%);opacity:.42}.feature-icon{width:78px;height:78px;margin-bottom:20px;filter:drop-shadow(0 0 15px currentColor)}.feature.playlists .feature-icon{color:#b7b9ff}.feature.fav .feature-icon{color:#ff9cad}.feature-title{font-size:clamp(25px,6vw,34px);font-weight:600;letter-spacing:-.5px}.feature-sub{font-size:17px;color:#bdc2d4;margin-top:10px}.chev{font-size:30px;margin-left:8px;font-weight:300}.view{display:none}.view.active{display:block}.view-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 20px}.view-head h2{font-size:28px;margin:0;letter-spacing:-.7px}.add-btn{width:54px;height:54px;border-radius:18px;border:1px solid var(--line);background:#20253a;font-size:30px;font-weight:300}.playlist-layout{display:grid;grid-template-columns:1fr;gap:20px}.playlist-list{display:grid;gap:12px}.playlist-row{display:flex;align-items:center;gap:15px;padding:8px 10px;border:1px solid transparent;border-radius:20px;background:transparent;text-align:left;width:100%}.playlist-row:active,.track-row:active{background:#ffffff0b}.cover{width:74px;height:74px;flex:none;border-radius:18px;object-fit:cover;background:linear-gradient(140deg,#253c78,#9a5baf)}.cover-placeholder{display:grid;place-items:center;color:#fff;font-size:25px;background:radial-gradient(circle at 75% 20%,#f18e9d,transparent 35%),linear-gradient(140deg,#242d6b,#684e9d)}.playlist-name{font-size:18px;font-weight:550}.sub{color:var(--muted);font-size:14px;margin-top:4px}.row-arrow{margin-left:auto;color:#b9bfd0;font-size:25px}.playlist-detail{border:1px solid var(--line);border-radius:30px;padding:20px;background:linear-gradient(155deg,#111625,#0e1220);min-width:0}.detail-top{display:flex;justify-content:space-between;align-items:center}.text-btn{border:0;background:transparent;color:#c5cadd;padding:8px}.detail-cover{width:min(220px,65%);aspect-ratio:1;object-fit:cover;border-radius:28px;display:block;margin:22px auto 16px;box-shadow:0 14px 50px #0008}.detail-title{text-align:center;font-size:28px;font-weight:600}.detail-meta{text-align:center;color:var(--muted);margin-top:7px}.controls{display:flex;gap:12px;justify-content:center;margin:22px 0}.pill-btn{border:1px solid var(--line);border-radius:18px;padding:14px 20px;background:#20263b;min-width:0}.pill-btn.primary{background:linear-gradient(110deg,#9be5ff,#54b8f5);color:#092036;border:0;box-shadow:0 0 25px #52c8ff66;font-weight:650}.track-list{display:grid;gap:5px}.track-row{display:flex;align-items:center;gap:12px;padding:8px 5px;border-radius:15px;min-width:0}.track-row .cover{width:54px;height:54px;border-radius:13px}.track-info{min-width:0;flex:1}.track-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-artist{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duration{font-size:13px;color:#aab1c6}.more{border:0;background:transparent;color:#c8cce0;font-size:22px;padding:8px}.search-tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid var(--line);background:#ffffff08;border-radius:99px;padding:9px 16px;color:#aeb6ce}.tab.active{background:#252d49;color:white;border-color:#6574bd}.results-note{color:var(--muted);font-size:14px;margin:14px 2px}.empty{color:var(--muted);text-align:center;padding:42px 18px;line-height:1.5}.empty strong{display:block;color:#e8e9f4;font-size:18px;margin-bottom:7px}.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(100%,480px);border:1px solid var(--line);border-radius:28px;background:#171c2d;padding:22px;box-shadow:var(--shadow)}.modal h3{margin:0 0 18px;font-size:22px}.modal input{width:100%;border:1px solid var(--line);background:#0d1220;color:white;border-radius:15px;padding:15px;margin-bottom:14px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1}.toast{position:fixed;bottom:calc(102px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#252c42;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:30;transition:.2s;max-width:calc(100% - 36px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.player{position:fixed;z-index:15;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0b1020ed,#090d18f7);backdrop-filter:blur(24px);border-top:1px solid var(--line);display:none}.player.visible{display:block}.player-inner{width:min(100%,860px);margin:auto;display:flex;align-items:center;gap:12px}.player .cover{width:48px;height:48px;border-radius:13px}.player-info{min-width:0;flex:1}.player-info .track-title{font-weight:600}.player-controls{display:flex;align-items:center;gap:10px}.icon-btn{width:42px;height:42px;border:0;background:transparent;font-size:22px}.play-btn{width:44px;height:44px;border:0;border-radius:50%;background:#91ddff;color:#092036;font-size:18px}.progress{width:min(100%,860px);height:3px;background:#333b55;margin:9px auto 0;border-radius:5px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:#83d9ff}.hidden{display:none!important}
    @media(min-width:700px){body{padding-top:38px}.app{padding:0 30px}.home-cards{grid-template-columns:1fr 1fr}.feature{min-height:320px}.playlist-layout{grid-template-columns:minmax(250px,.9fr) minmax(350px,1.1fr)}.playlist-list{align-content:start}.playlist-detail{min-height:600px}.playlist-detail .detail-cover{width:190px}.view-head{margin-top:34px}}
    @media(max-width:380px){.app{padding:0 15px}.feature{min-height:245px;border-radius:30px}.controls{gap:8px}.pill-btn{padding:13px 14px;font-size:14px}.cover{width:64px;height:64px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><button class="back" id="backBtn" aria-label="Назад">‹</button><h1 class="brand">Angel</h1><span style="width:42px" id="topSpacer"></span></header>
    <section id="homeView" class="view active">
      <label class="search-wrap" for="globalSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 5 5"/></svg><input id="globalSearch" placeholder="Поиск музыки, альбомов, исполнителей" autocomplete="off"></label>
      <div class="home-cards">
        <button class="feature playlists" id="openPlaylists"><svg class="feature-icon" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M34 54V14l34-8v42"/><ellipse cx="21" cy="58" rx="12" ry="9" fill="currentColor" stroke="none"/><ellipse cx="55" cy="49" rx="12" ry="9" fill="currentColor" stroke="none"/></svg><span class="feature-title">Ваши плейлисты <span class="chev">›</span></span><span class="feature-sub">Подборки под любое настроение</span></button>
        <button class="feature fav" id="openFavorites"><svg class="feature-icon" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40 68 12 41C-5 21 21 2 40 23 59 2 85 21 68 41L40 68Z"/></svg><span class="feature-title">Любимое <span class="chev">›</span></span><span class="feature-sub">Треки, которые тебе нравятся</span></button>
      </div>
    </section>
    <section id="searchView" class="view">
      <label class="search-wrap" for="searchInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 5 5"/></svg><input id="searchInput" placeholder="Поиск музыки, альбомов, исполнителей" autocomplete="off"></label>
      <div class="search-tabs"><button class="tab active" data-type="tracks">Треки</button><button class="tab" data-type="albums">Альбомы</button><button class="tab" data-type="artists">Исполнители</button></div>
      <div id="searchStatus" class="results-note">Введи название трека или исполнителя</div><div id="searchResults" class="track-list"></div>
    </section>
    <section id="playlistsView" class="view">
      <div class="view-head"><h2>Ваши плейлисты</h2><button class="add-btn" id="createPlaylist" aria-label="Создать плейлист">+</button></div>
      <div class="playlist-layout"><div id="playlistList" class="playlist-list"></div><div id="playlistDetail" class="playlist-detail hidden"></div></div>
    </section>
    <section id="favoritesView" class="view">
      <div class="view-head"><h2>Любимое</h2></div>
      <div class="playlist-layout"><div class="playlist-list"><div class="feature fav" style="min-height:190px;border-radius:28px;cursor:default"><svg class="feature-icon" style="width:58px;height:58px;margin-bottom:8px" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4"><path d="M40 68 12 41C-5 21 21 2 40 23 59 2 85 21 68 41L40 68Z"/></svg><span class="playlist-name">Любимое</span><span class="sub" id="favoriteCount">0 треков</span></div></div><div class="playlist-detail"><div class="detail-cover cover-placeholder" style="display:grid;place-items:center;font-size:68px;color:#ffb2c0">♡</div><div class="detail-title">Любимое</div><div class="detail-meta" id="favoriteMeta">0 треков</div><div class="controls"><button class="pill-btn primary" id="playFavorites">▶ Плей</button><button class="pill-btn" id="shuffleFavorites">⤨ Перемешать</button></div><div id="favoriteTracks" class="track-list"></div></div></div>
    </section>
  </main>
  <div class="player" id="player"><div class="player-inner"><img class="cover" id="playerCover" alt=""><div class="player-info"><div class="track-title" id="playerTitle">—</div><div class="track-artist" id="playerArtist">—</div></div><div class="player-controls"><button class="icon-btn" id="prevTrack" aria-label="Предыдущий">⏮</button><button class="play-btn" id="togglePlay" aria-label="Пауза">Ⅱ</button><button class="icon-btn" id="nextTrack" aria-label="Следующий">⏭</button></div></div><div class="progress"><i id="progressFill"></i></div></div>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h3 id="modalTitle">Новый плейлист</h3><input id="modalInput" maxlength="40" placeholder="Название плейлиста"><div class="modal-actions"><button class="pill-btn" id="cancelModal">Отмена</button><button class="pill-btn primary" id="confirmModal">Создать</button></div></div></div>
  <div class="toast" id="toast"></div><audio id="audio" preload="none"></audio>
  <script src="app.js"></script>
</body></html>
